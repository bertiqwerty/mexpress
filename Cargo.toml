# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package]
name = "mexpress"
version = "0.1.8"
edition = "2021"
repository = "https://github.com/bertiqwerty/mexpress"
license = "MIT"

[lib]
name = "mexpress"
crate-type = ["cdylib"]

[dependencies]
exmex = { version = "0.21.0", features = ["partial"] }
numpy = "0.29.0"
pyo3 = { version = "0.29.2", features = ["extension-module"] }
